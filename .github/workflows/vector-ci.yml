# Vector's own checks, on GitHub's free runners: pushes are checked here instead of on
# Isaac's machine. Upstream's workflows are disabled on this fork (repository setting).
name: Vector CI

on:
  push:
    branches: [main, "release/**"]

jobs:
  check:
    name: Typecheck and Vector tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Translation catalogs
        # Vector's strings aren't in upstream's catalogs; fill them in English as build.sh does.
        working-directory: packages/i18n
        run: |
          bun run extract > /dev/null
          python3 ../../vector/fill-translations.py locales
          bun run compile

      - name: Typecheck the desktop app
        working-directory: apps/desktop
        run: bun run typecheck

      - name: Typecheck host-service and the CLI
        run: |
          (cd packages/host-service && bun run typecheck)
          (cd packages/cli && bun run typecheck)

      - name: Vector tests
        working-directory: apps/desktop
        run: >-
          bun test src/shared/efforts.test.ts src/shared/queue.test.ts
          src/lib/trpc/routers/efforts
          src/renderer/routes/_authenticated/_dashboard/components/DashboardSidebar
